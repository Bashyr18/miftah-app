<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Lab</title>
<style>
:root{--bg:#0b0d14;--s1:#151925;--line:#2a3042;--t1:#f5f0e7;--t2:#b8b3a8;--acc:#d9b26f;--on-acc:#1a1206;--a2:#5ec8c0;--a3:#e98a7a;--a4:#8fa8ff}
.light{--bg:#fbf6ea;--s1:#fffdf8;--line:#e0d5bd;--t1:#231b0f;--t2:#5f5442;--acc:#8a6420;--on-acc:#fffaf0;--a2:#127a71;--a3:#b53d2a;--a4:#3552b5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
html,body{background:var(--bg);color:var(--t1);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:12px clamp(12px,2vw,24px) 24px;max-width:980px;margin-inline:auto}
.bench,.workspace{display:grid;gap:14px;align-items:start;min-width:0}
.workspace{container-type:inline-size}
.task{padding:12px 16px;border-inline-start:3px solid var(--acc);border-radius:12px;background:var(--s1);font-size:clamp(14px,1.5vw,17px);font-weight:600}
#stage{min-width:0}
canvas{display:block;width:100%;border-radius:16px;background:var(--s1);box-shadow:inset 0 0 0 1px var(--line)}
canvas.interactive{touch-action:none;cursor:crosshair}
.ctl{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.ctl fieldset{min-width:0;border:1px solid var(--line);border-radius:12px;padding:6px 12px 8px;background:var(--s1);display:grid;gap:5px}
.ctl legend{padding-inline:5px;font-weight:700;color:var(--t1);font-size:13px}
.ctl label{display:grid;min-width:0;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;font-size:13.5px;color:var(--t2)}
.ctl>label{padding:8px 12px 2px;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
.ctl b{color:var(--t1);font-variant-numeric:tabular-nums}
input[type=range]{grid-column:1/-1;width:100%;height:30px;accent-color:var(--acc)}
.out{display:flex;flex-wrap:wrap;gap:8px}
.out div{flex:1 1 92px;min-width:0;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12.5px;color:var(--t2)}
.out b{display:block;font-size:clamp(15px,1.8vw,19px);color:var(--t1);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.out .relation b{display:inline-grid;place-items:center;min-width:26px;background:color-mix(in srgb,var(--acc) 18%,var(--s1));color:var(--acc);border-radius:7px;margin-inline-end:6px}
.out .relation span{display:block;margin-top:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.workspace>:empty{display:none}
button{min-height:40px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--s1);color:var(--t1);font:inherit;font-weight:600;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
input[type=text]{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--s1);color:var(--t1);font-size:18px}
@container (min-width:420px){
  .ctl:has(>:nth-child(2)){grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:860px){
  body:has(.bench.guided){max-width:1420px}
  .bench.guided{grid-template-columns:minmax(0,1fr) clamp(340px,27vw,380px);gap:clamp(16px,2.2vw,28px)}
  .gd{position:sticky;inset-block-start:12px;max-height:calc(100dvh - 24px);overflow:auto;padding:3px;scrollbar-width:thin}
}
/* the guided investigation (guide.js): the idea, then predict, try, see why */
.gd{display:grid;gap:10px}.gd[hidden]{display:none}
.gd-idea{padding:12px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:14.5px;line-height:1.5;color:var(--t1)}
.gd-idea summary{cursor:pointer;list-style:none}.gd-idea summary::-webkit-details-marker{display:none}details.gd-idea small{display:inline;margin:0}details.gd-idea summary small::after{content:' ▸'}details[open].gd-idea summary small::after{content:' ▾'}.gd-idea p{margin-top:8px}
.gd-idea small,.gd-n{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.gd-card{padding:14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 7%,var(--s1));display:grid;gap:10px}
.gd-q{font-size:16px;font-weight:700;line-height:1.4;color:var(--t1)}
.gd-opts{display:grid;gap:6px}.gd-opts button{min-height:44px;text-align:start;font-weight:600;line-height:1.3;padding:8px 12px}
.gd-opts button.pick{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--s1));color:var(--t1);opacity:1}
.gd-do{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45;color:var(--t1)}
.gd-dot{flex:none;width:12px;height:12px;margin-top:5px;border-radius:50%;border:2px solid var(--acc);animation:gdp 1.4s ease-in-out infinite}
@keyframes gdp{50%{transform:scale(.6);opacity:.5}}
.gd-why{padding:12px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:14.5px;line-height:1.5;color:var(--t2)}
.gd-why b{display:block;color:var(--a2);font-size:14.5px;margin-bottom:4px}.gd-why b.miss{color:var(--acc)}
.gd-acts{display:flex;justify-content:flex-end;gap:8px}.gd-acts button{min-width:110px}
.gd-real{font-size:14px;line-height:1.5;color:var(--t2)}
.gd-prog{display:flex;gap:4px}.gd-prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.gd-prog i.on{background:var(--acc)}
@media (prefers-reduced-motion:reduce){.gd-dot{animation:none}}
