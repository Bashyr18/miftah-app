<!doctype html>
<!-- Miftah-Setup.exe's one window: what will happen, the copy, done. In the app's own colours, following the computer's
     light or dark setting and its language. windows/setup/src/main.rs fills window.SETUP and does the work. -->
<html><head><meta charset="utf-8">
<style>
/*FONTS*/
:root{--bg:#fbf6ea;--card:#fffdf8;--ink:#282116;--mute:#7a6d55;--gold:#a8782c;--on-gold:#fffaf0;--line:rgba(70,50,20,.18);--hover:rgba(70,50,20,.06);--f:"Quicksand","Segoe UI",system-ui,sans-serif;--fb:"Quicksand","Segoe UI",system-ui,sans-serif;--far:"Plex Arabic","Quicksand","Segoe UI",sans-serif;--fq:"Amiri","Plex Arabic",serif}
.dark{--bg:#0b0d14;--card:#151925;--ink:#f0e9dc;--mute:#9a937f;--gold:#d9b26f;--on-gold:#1a1206;--line:rgba(240,228,206,.16);--hover:rgba(240,228,206,.06)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;user-select:none;-webkit-user-select:none;cursor:default}
[dir=rtl] body{font-family:var(--far)}
[dir=rtl] h1,[dir=rtl] .btn,[dir=rtl] .steps b{font-family:var(--far)}
.win{display:grid;grid-template-columns:300px 1fr;height:100%}
/* the welcome's night: a deep sky, a few stars, a warm light behind the key */
.sky{position:relative;overflow:hidden;background:linear-gradient(180deg,#0d1433,#1d2752);color:#f6efe0;display:flex;flex-direction:column;align-items:center}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.ver{position:relative;margin-top:22px;font-size:12px;opacity:.6}
.glow{position:absolute;top:30px;left:50%;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:radial-gradient(circle,rgba(241,213,158,.36),rgba(241,213,158,0) 68%)}
.key{position:relative;margin-top:58px;width:96px;height:96px;border-radius:24px;box-shadow:0 8px 22px rgba(0,0,0,.35);overflow:hidden}
.key img{width:100%;height:100%;display:block}
.name{position:relative;margin-top:16px;font:700 29px/1.2 var(--f);letter-spacing:.2px}
.name-ar{position:relative;margin-top:2px;font:400 26px/1.4 var(--fq);color:#f1d59e}
.facts{position:absolute;bottom:26px;inset-inline:34px;margin:0;padding:0;list-style:none;display:grid;gap:9px}
.facts li{display:flex;align-items:center;gap:11px;font-size:12.5px;color:rgba(246,239,224,.86)}
.facts li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:#d9b26f}
/* the choices */
.main{position:relative;padding:32px 40px 30px;display:flex;flex-direction:column;min-width:0}
.steps{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.steps span{display:flex;align-items:center;gap:7px}
.steps b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--fb);background:var(--line);color:var(--mute)}
.steps .now,.steps .did{color:var(--ink)}
.steps .now{font-weight:600}
.steps .now b,.steps .did b{background:var(--gold);color:var(--on-gold)}
.steps i{width:16px;height:2px;background:var(--line)}
h1{margin:22px 0 0;font:700 27px/1.25 var(--f)}
.sub{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--mute);min-height:42px}
.box{margin-top:14px;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.box small{display:block;font-size:12px;color:var(--mute)}
.box div{min-width:0}
.box .path{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
[dir=rtl] .box .path{text-align:right}
svg{flex:none;width:24px;height:24px;stroke:var(--gold);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tog{margin-top:10px;width:100%;display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:inherit;font:inherit;text-align:start;cursor:pointer}
.tog:hover{background:linear-gradient(var(--hover),var(--hover)),var(--card)}
.tog:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tog div{flex:1;min-width:0}
.tog strong{display:block;font-size:14px;font-weight:600}
.tog small{display:block;margin-top:1px;font-size:12px;color:var(--mute)}
.sw{flex:none;position:relative;width:40px;height:22px;border-radius:11px;background:var(--line);transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:inset-inline-start .18s,background .18s}
.tog[aria-checked=true] .sw{background:var(--gold)}
.tog[aria-checked=true] .sw::after{inset-inline-start:21px;background:var(--on-gold)}
.bar{margin-top:30px;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:2%;border-radius:5px;background:linear-gradient(90deg,#f6dda5,#c79c52);transition:width .2s}
[dir=rtl] .bar i{background:linear-gradient(270deg,#f6dda5,#c79c52)}
.bar-l{margin-top:10px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.bar-l b{color:var(--ink);font-weight:600}
.ok{margin-top:24px;display:flex;gap:16px;align-items:flex-start}
.ok .tick{flex:none;width:44px;height:44px;border-radius:50%;background:var(--gold);display:grid;place-items:center}
.ok .tick svg{stroke:var(--on-gold);stroke-width:3;width:26px;height:26px}
.ok p,.err p{margin:2px 0 0;font-size:13px;line-height:1.55;color:var(--mute)}
.err{margin-top:24px}
.err strong{font-weight:600;font-size:14px}
.acts{margin-top:auto;display:flex;justify-content:flex-end;gap:12px}
.btn{height:44px;min-width:112px;padding:0 22px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--ink);font:700 14px var(--fb);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.pri{min-width:150px;background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.pri:hover{filter:brightness(1.08)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="win">
  <aside class="sky" aria-hidden="true">
    <canvas id="stars"></canvas>
    <div class="ver" id="ver"></div>
    <div class="glow"></div>
    <div class="key"><img id="icon" alt=""></div>
    <div class="name">Miftāḥ</div>
    <div class="name-ar" lang="ar">مِفْتَاح</div>
    <ul class="facts" id="facts"></ul>
  </aside>
  <main class="main">
    <div class="steps" id="steps"></div>
    <h1 id="head"></h1>
    <p class="sub" id="sub"></p>
    <section id="start">
      <div class="box"><svg viewBox="0 0 24 24"><path d="M3 7.5v9.5l2 2h14l2-2V9.5l-2-2h-8l-2-2H5z"/></svg><div><small id="forYou"></small><span class="path" id="path"></span></div></div>
      <button class="tog" role="switch" id="desk"><svg viewBox="0 0 24 24"><rect x="2.8" y="4" width="18.4" height="12" rx="1.5"/><path d="M8.5 20h7M12 16v4"/></svg><div><strong></strong><small></small></div><span class="sw"></span></button>
      <button class="tog" role="switch" id="boot"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg><div><strong></strong><small></small></div><span class="sw"></span></button>
    </section>
    <section id="copy" hidden>
      <div class="bar"><i id="fill"></i></div>
      <div class="bar-l"><span id="what"></span><b id="pc">0%</b></div>
    </section>
    <section id="done" hidden>
      <div class="ok"><span class="tick"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></span><p id="kept"></p></div>
    </section>
    <section id="error" hidden>
      <div class="err"><strong id="errHead"></strong><p id="errText"></p></div>
    </section>
    <div class="acts"><button class="btn" id="cancel"></button><button class="btn pri" id="go"></button></div>
  </main>
</div>
<script>
(function () {
  'use strict';
  var S = window.SETUP || {}, ar = !!S.ar, stage = 'start';
  var T = function (en, a) { return ar ? a : en; };
  var $ = function (id) { return document.getElementById(id); };
  document.documentElement.lang = ar ? 'ar' : 'en';
  document.documentElement.dir = ar ? 'rtl' : 'ltr';
  if (S.dark) document.documentElement.className = 'dark';
  $('icon').src = S.icon || '';
  $('ver').textContent = T('Version ', 'الإصدار ') + S.version;
  [T('Lessons for ages 2 to 18', 'دروس من سنتين إلى ١٨'), T('Works without the internet', 'يعمل بلا إنترنت'), T('No account, no adverts', 'بلا حساب ولا إعلانات')]
    .forEach(function (f) { var li = document.createElement('li'); li.textContent = f; $('facts').appendChild(li); });
  $('forYou').textContent = T('Installs for you, no administrator needed', 'لك وحدك، بلا صلاحيات مدير');
  $('path').textContent = S.path; $('path').title = S.path;
  function tog(id, on, t, sub) { var b = $(id); b.setAttribute('aria-checked', on); b.querySelector('strong').textContent = t; b.querySelector('small').textContent = sub; b.onclick = function () { b.setAttribute('aria-checked', b.getAttribute('aria-checked') !== 'true'); }; }
  tog('desk', true, T('A shortcut on the desktop', 'اختصار على سطح المكتب'), T('Miftāḥ is always in the Start menu', 'مفتاح دائمًا في قائمة ابدأ'));
  tog('boot', !!S.boot, T('Open with Windows', 'افتحه مع ويندوز'), T('Quietly in the tray, for the phone and reminders', 'بهدوء في شريط المهام، للهاتف والتذكير'));
  var on = function (id) { return $(id).getAttribute('aria-checked') === 'true'; };

  /* a few stars, the same every time */
  (function () {
    var c = $('stars'), k = window.devicePixelRatio || 1, w = 300, h = c.parentNode.clientHeight || 480;
    c.width = w * k; c.height = h * k; var g = c.getContext('2d'); g.scale(k, k);
    var seed = 7; var rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    for (var i = 0; i < 46; i++) { var x = rnd() * w, y = rnd() * h * .78, r = rnd() * .7 + .25, a = (60 + rnd() * 150) / 255; g.fillStyle = 'rgba(255,244,214,' + a.toFixed(2) + ')'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  })();

  function lay() {
    var have = S.have, same = have && have === S.version;
    var names = [T('Choose', 'اختر'), T('Install', 'ثبّت'), T('Done', 'تم')], at = stage === 'copy' ? 1 : stage === 'done' ? 3 : 0;
    $('steps').innerHTML = names.map(function (n, i) { return '<span class="' + (i < at ? 'did' : i === at ? 'now' : '') + '"><b>' + (i < at ? '✓' : (ar ? '١٢٣'[i] : i + 1)) + '</b>' + n + '</span>'; }).join('<i></i>');
    $('head').textContent = stage === 'done' ? T('Miftāḥ is installed', 'تم تثبيت مفتاح') : stage === 'copy' ? T('Installing Miftāḥ', 'جارٍ تثبيت مفتاح') : stage === 'error' ? T('It could not be installed', 'تعذّر التثبيت') : !have || same ? T('Install Miftāḥ', 'ثبّت مفتاح') : T('Update Miftāḥ', 'حدّث مفتاح');
    $('sub').textContent = stage === 'copy' ? T('This takes a few seconds.', 'يستغرق ثوانيَ قليلة.')
      : stage === 'done' ? T('Find it in the Start menu' + (on('desk') ? ' and on the desktop.' : '.'), 'تجده في قائمة ابدأ' + (on('desk') ? ' وعلى سطح المكتب.' : '.'))
      : stage === 'error' ? ''
      : same ? T('Version ' + have + ' is already here. Installing again repairs it.', 'الإصدار ' + have + ' مثبّت. التثبيت مجددًا يصلحه.')
      : have ? T('From ' + have + ' to ' + S.version + '. Your family’s record stays as it is.', 'من ' + have + ' إلى ' + S.version + '. يبقى سجل عائلتك كما هو.')
      : T('An Islamic homeschool for the whole family, on this computer.', 'مدرسة منزلية إسلامية للعائلة كلها، على هذا الحاسوب.');
    ['start', 'copy', 'done', 'error'].forEach(function (s) { $(s).hidden = s !== stage; });
    $('go').hidden = stage === 'copy'; $('cancel').hidden = stage === 'copy';
    $('cancel').textContent = stage === 'done' ? T('Close', 'إغلاق') : T('Cancel', 'إلغاء');
    $('go').textContent = stage === 'done' ? T('Open Miftāḥ', 'افتح مفتاح') : stage === 'error' ? T('Try again', 'أعد المحاولة') : !have ? T('Install', 'ثبّت') : same ? T('Reinstall', 'أعد التثبيت') : T('Update', 'حدّث');
    $('kept').textContent = T('The family’s record lives in a folder of its own, so updating or removing Miftāḥ never touches it. Remove it from Settings › Apps like any program.', 'يُحفظ سجل العائلة في مجلد خاص به، فلا يمسّه تحديث مفتاح أو حذفه. ويُزال من الإعدادات › التطبيقات كأي برنامج.');
    $('errHead').textContent = T('Nothing was changed. Close any open Miftāḥ and try again.', 'لم يتغير شيء. أغلق مفتاح إن كان مفتوحًا وحاول مجددًا.');
    if (stage !== 'copy') setTimeout(function () { $('go').focus(); }, 0);
  }
  var send = function (o) { chrome.webview.postMessage(JSON.stringify(o)); };
  $('go').onclick = function () {
    if (stage === 'start') { stage = 'copy'; progress(0); lay(); send({ do: 'install', desk: on('desk'), boot: on('boot') }); }
    else if (stage === 'done') send({ do: 'open' });
    else if (stage === 'error') { stage = 'start'; lay(); }
  };
  $('cancel').onclick = function () { send({ do: 'close' }); };
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && stage !== 'copy') send({ do: 'close' }); });
  addEventListener('contextmenu', function (e) { e.preventDefault(); });
  function progress(p) {
    $('fill').style.width = Math.max(2, Math.round(p * 100)) + '%';
    $('pc').textContent = (ar ? Math.round(p * 100).toLocaleString('ar-u-nu-arab') + '٪' : Math.round(p * 100) + '%');
    $('what').textContent = p < .9 ? T('Copying Miftāḥ into its folder', 'نسخ مفتاح إلى مجلده') : T('Adding it to Start and Settings › Apps', 'إضافته إلى قائمة ابدأ والإعدادات › التطبيقات');
  }
  /* what the program says back */
  window.Setup = {
    progress: progress,
    done: function () { stage = 'done'; lay(); },
    error: function (m) { stage = 'error'; lay(); $('errText').textContent = m || ''; }
  };
  lay();
})();
</script>
</body></html>
