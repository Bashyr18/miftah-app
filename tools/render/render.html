<!doctype html><meta charset="utf-8"><title>Miftah art factory</title>
<body style="background:#222;color:#eee;font:13px monospace"><canvas id="c"></canvas><pre id="log"></pre>
<script src="scenes.js"></script>
<script>
/* A small progressive path tracer over signed distance fields. Each scene supplies map() and mat(); the result is saved with alpha. */
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`;
const CORE = `#version 300 es
precision highp float; precision highp int;
uniform vec2 uRes; uniform int uFrame; uniform sampler2D uPrev;
uniform vec3 uCam, uTarget, uSunDir, uSunCol, uSkyA, uSkyB, uTint; uniform float uFov, uSunR, uGround, uShadow, uEnvK, uOrtho, uFog; uniform int uEnv;
out vec4 fragColor;
uint seed;
float rnd(){ seed=seed*747796405u+2891336453u; uint w=((seed>>((seed>>28u)+4u))^seed)*277803737u; return float((w>>22u)^w)/4294967295.0; }
float hash(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.-2.*f);
 return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+7.;a*=.5;} return s; }
mat2 R(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float sph(vec3 p,float r){ return length(p)-r; }
float ell(vec3 p,vec3 r){ float k0=length(p/r),k1=length(p/(r*r)); return k0*(k0-1.)/max(k1,1e-5); }
float cap(vec3 p,vec3 a,vec3 b,float r){ vec3 pa=p-a,ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float rbox(vec3 p,vec3 b,float r){ vec3 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r; }
float cyl(vec3 p,float h,float r,float rd){ vec2 d=vec2(length(p.xz)-r+rd,abs(p.y)-h+rd); return min(max(d.x,d.y),0.)+length(max(d,0.))-rd; }
float tor(vec3 p,float R_,float r){ return length(vec2(length(p.xz)-R_,p.y))-r; }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
float smax(float a,float b,float k){ return -smin(-a,-b,k); }
struct Mat{ vec3 a; float r; float m; vec3 e; float t; };
Mat M(vec3 a,float r,float m){ Mat x; x.a=a; x.r=r; x.m=m; x.e=vec3(0.); x.t=0.; return x; }
Mat E(vec3 a,vec3 e){ Mat x=M(a,.6,0.); x.e=e; return x; }
Mat G(vec3 a,float r){ Mat x=M(a,r,0.); x.t=1.; return x; }
int gM=0;
#define U(d,m) { float d_=(d); if(d_<r){ r=d_; gM=(m);} }
//SCENE
int nSave=0;
vec3 nrm(vec3 p){ float e=.0006; vec2 k=vec2(1,-1); return normalize(k.xyy*map(p+k.xyy*e)+k.yyx*map(p+k.yyx*e)+k.yxy*map(p+k.yxy*e)+k.xxx*map(p+k.xxx*e)); }
float march(vec3 ro,vec3 rd,float tmax){ float t=.002; for(int i=0;i<170;i++){ float d=map(ro+rd*t); if(d<.0005*max(t,.6)) return t; t+=d*.92; if(t>tmax) break; } return -1.; }
float marchIn(vec3 ro,vec3 rd){ float t=.004; for(int i=0;i<80;i++){ float d=-map(ro+rd*t); if(d<.0008) return t; t+=max(d,.002); if(t>8.) break; } return t; }
vec3 rs(){ float z=rnd()*2.-1.,a=rnd()*6.2831853,r=sqrt(max(0.,1.-z*z)); return vec3(r*cos(a),r*sin(a),z); }
vec3 env(vec3 d){
 if(uEnv==0){ float t=d.y*.5+.5; vec3 c=mix(vec3(.22,.2,.19),vec3(.92,.94,1.),smoothstep(.1,1.,t));
  c+=1.7*smoothstep(.62,.95,dot(d,normalize(vec3(-.45,.8,.55))))*vec3(1.,.97,.92);
  c+=.9*smoothstep(.72,.98,dot(d,normalize(vec3(.85,.25,-.5))))*vec3(.92,.96,1.1);
  c+=.35*smoothstep(.75,1.,dot(d,normalize(vec3(.7,.1,.7))))*vec3(1.,.9,.8);
  return c*uEnvK; }
 float t=clamp(d.y,0.,1.); vec3 c=mix(uSkyB,uSkyA,pow(t,.55)); if(d.y<0.) c=mix(uSkyB,uSkyB*.35,clamp(-d.y*3.,0.,1.)); return c*uEnvK;
}
vec4 trace(vec3 ro,vec3 rd){
 float t0=march(ro,rd,40.);
 float tg=(uGround<-50.)?-1.:(uGround-ro.y)/rd.y;
 if(tg>0.&&(t0<0.||tg<t0)){
  if(uShadow<=0.) return vec4(0.);
  vec3 p=ro+rd*tg; vec3 n=vec3(0,1,0);
  float occ=0.;
  vec3 ld=normalize(uSunDir+rs()*uSunR); if(march(p+n*.004,ld,20.)>0.) occ+=.72;
  vec3 d2=normalize(n+rs()); if(march(p+n*.004,d2,6.)>0.) occ+=.55;
  return vec4(0.,0.,0.,min(occ,1.)*uShadow);
 }
 if(t0<0.) return vec4(0.);
 vec3 L=vec3(0.),T=vec3(1.); float t=t0; bool specLast=true;
 for(int b=0;b<6;b++){
  vec3 p=ro+rd*t; map(p); int mid=gM; vec3 n=nrm(p); gM=mid; Mat m=mat(p,n);
  L+=T*m.e;
  float cosI=max(dot(n,-rd),0.); float f0=m.m>.5?1.:.04; float F=f0+(1.-f0)*pow(1.-cosI,5.);
  if(m.t>.5){
   float Fg=.02+.98*pow(1.-cosI,5.);
   if(rnd()<Fg){ rd=normalize(reflect(rd,n)+rs()*m.r*m.r); ro=p+n*.004; specLast=true; }
   else { vec3 rf=refract(rd,n,1./1.33); vec3 pi=p-n*.006; float ti=marchIn(pi,rf); vec3 pe=pi+rf*ti; vec3 ne=-nrm(pe); vec3 out_=refract(rf,ne,1.33); if(dot(out_,out_)<.01) out_=reflect(rf,ne); T*=pow(m.a,vec3(ti*.9)); rd=out_; ro=pe-ne*.006; specLast=true; }
  } else {
   float pS=m.m>.5?1.:clamp(F,.06,.9);
   if(rnd()<pS){ vec3 w=normalize(reflect(rd,n)+rs()*m.r*m.r); if(dot(w,n)<0.) w=reflect(w,n); rd=w; ro=p+n*.003; T*=(m.m>.5?m.a*(F*.3+.7):vec3(1.))*(m.m>.5?1.:F/pS); specLast=true; }
   else {
    vec3 alb=m.a*(1.-F)/(1.-pS);
    vec3 ld=normalize(uSunDir+rs()*uSunR); float nl=dot(n,ld);
    if(nl>0.&&march(p+n*.003,ld,30.)<0.) L+=T*alb*uSunCol*nl;
    rd=normalize(n+rs()); ro=p+n*.003; T*=alb; specLast=false;
   }
  }
  t=march(ro,rd,30.);
  float tg2=(uGround<-50.)?-1.:(uGround-ro.y)/rd.y;
  if(tg2>0.&&(t<0.||tg2<t)){ L+=T*vec3(.62,.6,.58)*env(vec3(0,1,0))*.62; break; }
  if(t<0.){ L+=T*env(rd); if(specLast){ float s=dot(rd,normalize(uSunDir)); L+=T*uSunCol*3.*smoothstep(1.-uSunR*uSunR*2.-.002,1.,s); } break; }
  if(b>2){ float q=max(T.x,max(T.y,T.z)); if(rnd()>q) break; T/=q; }
 }
 return vec4(min(L,vec3(12.)),1.);
}
void main(){
 seed=uint(gl_FragCoord.x)*1973u+uint(gl_FragCoord.y)*9277u+uint(uFrame)*26699u+1u; rnd();
 vec2 jit=vec2(rnd(),rnd())-.5;
 vec2 uv=2.*(gl_FragCoord.xy+jit-.5*uRes)/uRes.y;
 vec3 f=normalize(uTarget-uCam),r_=normalize(cross(f,vec3(0,1,0))),u=cross(r_,f);
 vec3 ro,rd;
 if(uOrtho>0.){ ro=uCam+(r_*uv.x+u*uv.y)*uOrtho; rd=f; }
 else { float z=1./tan(uFov*.00872665); ro=uCam; rd=normalize(r_*uv.x+u*uv.y+f*z); }
 vec4 c=trace(ro,rd);
 if(uFog>0.&&c.a>.99){}
 vec4 prev=texelFetch(uPrev,ivec2(gl_FragCoord.xy),0);
 fragColor=(uFrame==0)?c:prev+(c-prev)/float(uFrame+1);
}`;
const DISP = `#version 300 es
precision highp float; uniform sampler2D t; out vec4 o; uniform float uExp;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
void main(){ vec4 c=texelFetch(t,ivec2(gl_FragCoord.xy),0); float a=c.a; vec3 col=a>.0001?c.rgb/a:vec3(0.); col=aces(col*uExp); col=pow(col,vec3(1./2.2)); o=vec4(col,a); }`;
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{powerPreference:'high-performance',antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:true,alpha:true});
gl.getExtension('EXT_color_buffer_float');
const log=m=>{document.getElementById('log').textContent=m+'\n'+document.getElementById('log').textContent.slice(0,800);console.log(m)};
const quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
function prog(fs){ const p=gl.createProgram(); for(const [t,s] of [[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,fs]]){ const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh); if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); gl.attachShader(p,sh);} gl.bindAttribLocation(p,0,'a'); gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
const disp=prog(DISP);
function target(w,h){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,w,h,0,gl.RGBA,gl.FLOAT,null); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST); const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0); return {t,f}; }
const nv=(a)=>{const l=Math.hypot(...a);return a.map(x=>x/l)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function render(s,D){
 const cfg=Object.assign({w:768,h:768,spp:220,cam:[0,.42,4.6],target:[0,-.02,0],fov:27,ground:-1.02,shadow:.5,env:0,envK:.62,sun:[-.55,.95,.7],sunCol:[1.5,1.42,1.3],sunR:.14,skyA:[.3,.5,.9],skyB:[.8,.85,.9],exp:1.0,ortho:0,tint:[1,1,1]},D.defaults,s);
 const q=(new URLSearchParams(location.search)).get('scale'); const k=q?+q:1;
 const w=Math.round(cfg.w*k),h=Math.round(cfg.h*k),spp=Math.max(8,Math.round(cfg.spp*(q?+q*0.5:1)));
 cv.width=w;cv.height=h; gl.viewport(0,0,w,h);
 const p=prog(CORE.replace('//SCENE',s.code));
 gl.useProgram(p); gl.enableVertexAttribArray(0); gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
 const u=n=>gl.getUniformLocation(p,n);
 gl.uniform2f(u('uRes'),w,h); gl.uniform3fv(u('uCam'),cfg.cam); gl.uniform3fv(u('uTarget'),cfg.target); gl.uniform3fv(u('uSunDir'),nv(cfg.sun)); gl.uniform3fv(u('uSunCol'),cfg.sunCol); gl.uniform3fv(u('uSkyA'),cfg.skyA); gl.uniform3fv(u('uSkyB'),cfg.skyB); gl.uniform3fv(u('uTint'),cfg.tint);
 gl.uniform1f(u('uFov'),cfg.fov); gl.uniform1f(u('uSunR'),cfg.sunR); gl.uniform1f(u('uGround'),cfg.ground); gl.uniform1f(u('uShadow'),cfg.shadow); gl.uniform1f(u('uEnvK'),cfg.envK); gl.uniform1f(u('uOrtho'),cfg.ortho); gl.uniform1f(u('uFog'),0); gl.uniform1i(u('uEnv'),cfg.env); gl.uniform1i(u('uPrev'),0);
 let A=target(w,h),B=target(w,h);
 for(let i=0;i<spp;i++){
  gl.useProgram(p); gl.uniform1i(u('uFrame'),i); gl.bindFramebuffer(gl.FRAMEBUFFER,B.f); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,A.t); gl.disable(gl.BLEND); gl.drawArrays(gl.TRIANGLES,0,3); const x=A;A=B;B=x;
  if(i%8===7){ gl.finish(); await sleep(0); }
 }
 gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.useProgram(disp); gl.uniform1f(gl.getUniformLocation(disp,'uExp'),cfg.exp); gl.uniform1i(gl.getUniformLocation(disp,'t'),0); gl.bindTexture(gl.TEXTURE_2D,A.t); gl.drawArrays(gl.TRIANGLES,0,3);
 const buf=new Uint8Array(w*h*4); gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,buf);
 const c2=document.createElement('canvas'); c2.width=w;c2.height=h; const g2=c2.getContext('2d'); const im=g2.createImageData(w,h);
 for(let y=0;y<h;y++){ im.data.set(buf.subarray((h-1-y)*w*4,(h-y)*w*4),y*w*4); } g2.putImageData(im,0,0);
 const blob=await new Promise(r=>c2.toBlob(r,'image/webp',.92));
 await fetch('/save/'+s.name+'.webp',{method:'POST',body:blob});
 gl.deleteProgram(p); for(const X of [A,B]){gl.deleteTexture(X.t);gl.deleteFramebuffer(X.f);}
}
(async()=>{
 const P=new URLSearchParams(location.search); const only=P.get('only'); const list=window.SCENES.filter(s=>!only||only.split(',').includes(s.name)||only.split(',').includes(s.group));
 const dbg=gl.getExtension('WEBGL_debug_renderer_info'); const gpu=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'?';
 await fetch('/log',{method:'POST',body:'GPU '+gpu+' scenes '+list.length});
 for(const s of list){ const t0=performance.now(); try{ await render(s,window); await fetch('/log',{method:'POST',body:s.name+' '+Math.round(performance.now()-t0)+'ms'}); }catch(e){ await fetch('/log',{method:'POST',body:'ERR '+s.name+' '+String(e.message).slice(0,600)}); } }
 await fetch('/done',{method:'POST',body:'x'});
})();
</script>
