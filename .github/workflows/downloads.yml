# Once a day, a snapshot of GitHub's own download counts for every release file (tools/download_stats.py).
# It lives on the `stats` branch, so the daily commit never touches main, its checks or its Pages build;
# the guide reads it from raw.githubusercontent.com. Nobody is tracked: these are GitHub's counters, nothing more.
name: download counts
on:
  schedule:
    - cron: '17 3 * * *'     # 03:17 UTC daily
  release:
    types: [published]       # a fresh starting point the moment a version ships
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: download-stats
  cancel-in-progress: false
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: stats
          path: stats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count
        run: python -I main/tools/download_stats.py stats/downloads.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save
        working-directory: stats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -q -m "Download counts $(date -u +%F)"
          git push -q
